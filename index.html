<!-- <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Ibrahim Wani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efeee8; --card:#f8f7f3; --ink:#1e1a18; --muted:#6b645e; --rule:#d8d4cc;
  --chinar:#c4521f; --chinar-deep:#8e2f14; --soft:#f3dccd; --calm:#3f7d5c; --warn:#b98a1e; --crit:#b4432f;
  --display:"Gloock","Iowan Old Style",Georgia,serif;
  --sans:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#16120f; --card:#1f1915; --ink:#f0eae3; --muted:#a89f96; --rule:#342c27;
  --chinar:#e57a45; --chinar-deep:#f0a27a; --soft:#3a2217; --calm:#7cbf97; --warn:#d9b04e; --crit:#e07a63;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#16120f; --card:#1f1915; --ink:#f0eae3; --muted:#a89f96; --rule:#342c27;
  --chinar:#e57a45; --chinar-deep:#f0a27a; --soft:#3a2217; --calm:#7cbf97; --warn:#d9b04e; --crit:#e07a63;}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{text-wrap:pretty;margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--chinar);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.mark{font-family:var(--display);font-size:1.25rem;text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:8px}
.mark svg{width:20px;height:20px;color:var(--chinar)}
.nav{display:flex;gap:clamp(12px,2.4vw,26px);margin-left:auto;font-size:.92rem;color:var(--muted)}
.nav a{text-decoration:none}
.nav a:hover{color:var(--ink)}
.present{margin-left:8px;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:99px;padding:5px 13px;font:500 .82rem var(--sans);cursor:pointer}
.present[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:640px){.nav .opt{display:none}}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(24px,5vw,64px);align-items:end;padding-block:clamp(36px,7vw,80px) 0}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.status{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--card);border-radius:99px;padding:5px 12px 5px 10px;font-size:.84rem}
.status i{width:8px;height:8px;border-radius:50%;background:var(--calm);box-shadow:0 0 0 4px color-mix(in srgb,var(--calm) 22%,transparent)}
.hero h1{font-size:clamp(3rem,8.6vw,6.4rem);line-height:.95;margin-top:22px}
.hero h1 em{font-style:normal;color:var(--chinar)}
.lede{font-size:clamp(1.1rem,2vw,1.3rem);max-width:36ch;margin-top:22px;color:var(--ink)}
.lede b{font-weight:500;background:linear-gradient(transparent 62%,var(--soft) 62%)}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-size:.92rem;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border-radius:99px;padding:10px 18px;font-weight:500;font-size:.95rem;border:1px solid var(--ink);transition:transform .2s ease,background .2s ease}
.btn:hover{transform:translateY(-2px)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent}
.btn svg{width:17px;height:17px}
.btn.todo{border-style:dashed;color:var(--muted);border-color:var(--rule);cursor:default}
.btn.todo:hover{transform:none}

.portrait{position:relative;justify-self:center;width:min(100%,420px);aspect-ratio:4/5.2;max-width:100%}
.arch{position:absolute;inset:12% 18% 0 18%;border-radius:999px 999px 18px 18px;background:
  radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--chinar) 70%,#fff 0%),var(--chinar-deep) 95%);overflow:hidden}
:root[data-theme="dark"] .arch{background:radial-gradient(circle at 50% 30%,#d9683a,#6e2410 95%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .arch{background:radial-gradient(circle at 50% 30%,#d9683a,#6e2410 95%)}}
.arch .leaf{position:absolute;width:78%;left:11%;top:6%;color:#fff;opacity:.14;transform:rotate(-12deg)}
.portrait img{position:absolute;top:12%;left:18%;width:64%;height:88%;object-fit:cover;object-position:50% 40%;
  border-radius:999px 999px 18px 18px;box-shadow:0 18px 30px rgba(40,10,0,.25)}
.portrait .tag{position:absolute;right:0;top:26%;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:8px 12px;font-size:.8rem;box-shadow:0 10px 24px rgba(0,0,0,.08);line-height:1.35}
.portrait .tag b{display:block;font-family:var(--display);font-weight:400;font-size:1.5rem}
.portrait .tag.l{left:0;right:auto;top:auto;bottom:14%}
@media (max-width:820px){.portrait{width:min(86%,360px)}}

/* ---------- glance strip ---------- */
.glance{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--ink);margin-top:0}
.glance div{padding:22px 18px;border-left:1px solid var(--rule)}
.glance div:first-child{border-left:0;padding-left:0}
.glance b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(2rem,4.4vw,3rem);line-height:1}
.glance span{font-size:.88rem;color:var(--muted)}
@media (max-width:640px){.glance{grid-template-columns:repeat(2,minmax(0,1fr))}.glance div:nth-child(3){border-left:0;padding-left:0}.glance div:nth-child(n+3){border-top:1px solid var(--rule)}}

/* ---------- sections ---------- */
section.s{padding-block:clamp(56px,9vw,104px) 0;scroll-margin-top:60px}
.shead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:34px}
.shead h2{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1}

.proj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(24px,4vw,56px);background:var(--card);border:1px solid var(--rule);border-radius:22px;padding:clamp(20px,3.4vw,40px)}
.proj+.proj{margin-top:22px}
@media (max-width:860px){.proj{grid-template-columns:minmax(0,1fr)}}
.proj h3{font-size:clamp(2rem,4vw,2.8rem);line-height:1.02}
.role{font-family:var(--mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--chinar-deep);margin-top:8px}
.proj .kick{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}
.proj p.sum{margin-top:14px;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.chips li{list-style:none;font-family:var(--mono);font-size:.74rem;border:1px solid var(--rule);border-radius:99px;padding:3px 10px;color:var(--muted)}
.chips{padding:0;margin-bottom:0}
.plinks{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px;margin:0;padding:0}
@media (max-width:520px){.feat{grid-template-columns:minmax(0,1fr)}}
.feat li{list-style:none;border-top:1px solid var(--rule);padding-top:10px}
.feat b{display:block;font-weight:600;font-size:.97rem}
.feat span{display:block;color:var(--muted);font-size:.92rem;line-height:1.5;margin-top:3px}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:22px}
.nums div{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;background:var(--bg)}
.nums b{display:block;font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.1}
.nums span{font-size:.76rem;color:var(--muted)}
@media (max-width:520px){.nums{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* try-it widgets */
.try{margin-top:26px;border:1px dashed var(--rule);border-radius:16px;padding:16px 18px;background:var(--bg)}
.try .eyebrow{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}
.gst{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:520px){.gst{grid-template-columns:minmax(0,1fr)}}
.gst label{display:flex;flex-direction:column;gap:5px;font-size:.86rem;color:var(--muted)}
.gst input,.gst select{font:500 1rem var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:9px 11px;width:100%}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--rule);background:var(--card);color:var(--muted);border-radius:10px;padding:8px 0;font:500 .9rem var(--mono);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bill{font-family:var(--mono);font-size:.86rem;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.bill div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.bill .t{border-top:1px solid var(--ink);margin-top:6px;padding-top:8px;font-weight:500}
.bill .pill{font-size:.7rem;border-radius:99px;padding:1px 8px;background:var(--soft);color:var(--chinar-deep)}
.bands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bands button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--muted)}
.bands button i{display:block;height:12px;border-radius:4px;transition:transform .25s ease;opacity:.7}
.bands button[aria-pressed="true"]{color:var(--ink)}
.bands button[aria-pressed="true"] i{transform:scaleY(1.7);opacity:1}
.bands button:focus-visible{outline:2px solid var(--chinar);outline-offset:3px}
.bandnote{margin-top:14px;font-size:.95rem;min-height:3em}
.algos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px;margin:0;padding:0;counter-reset:a}
.algos li{list-style:none;border-bottom:1px solid var(--rule);padding:8px 0;font-size:.95rem;display:flex;gap:10px;align-items:baseline}
.algos li::before{counter-increment:a;content:counter(a,decimal-leading-zero);font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.algos li.win{color:var(--chinar-deep)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.qg textarea{display:block;width:100%;min-height:10.5em;resize:vertical;font:400 .92rem/1.55 var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.qgout{margin-top:12px;font-size:.92rem}
.qgout .v{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.qgout .v b{font-weight:500;border-radius:99px;padding:2px 10px}
.qgout .v b.pass{background:color-mix(in srgb,var(--calm) 18%,transparent);color:var(--calm)}
.qgout .v b.review{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.qgout ul{margin:8px 0 0;padding-left:1.1em}
.qgout li{margin-top:3px}
.qghint{margin-top:10px;font-size:.84rem;color:var(--muted)}
.stat{margin:0;padding:0}
.stat li{list-style:none;display:flex;gap:10px;align-items:baseline;padding:6px 0}
.stat li+li{border-top:1px solid var(--rule)}
.stat b{flex:0 0 auto;min-width:6.5em;font-size:.78rem;font-family:var(--mono);border-radius:99px;padding:2px 10px;text-align:center}
.stat li.ok b{background:color-mix(in srgb,var(--calm) 18%,transparent);color:var(--calm)}
.stat li.todo b{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.stat span{font-size:.9rem;color:var(--muted)}
.stat code{font-family:var(--mono);font-size:.85em;background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:0 4px}

/* ---------- journey ---------- */
.route{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:22px;padding:clamp(20px,3.4vw,40px);overflow:hidden}
.route svg.map{width:100%;height:auto;display:block}
.stops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:22px}
@media (max-width:760px){.stops{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.stops{grid-template-columns:minmax(0,1fr)}}
.stop{border-top:2px solid var(--ink);padding-top:10px}
.stop .when{font-family:var(--mono);font-size:.76rem;color:var(--chinar-deep)}
.stop b{display:block;font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1.15;margin-top:4px}
.stop span{display:block;color:var(--muted);font-size:.9rem;margin-top:4px}

/* ---------- skills ---------- */
.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 34px}
@media (max-width:820px){.skills{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.skills{grid-template-columns:minmax(0,1fr)}}
.skills h3{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--chinar-deep);margin-bottom:8px}
.skills p{font-family:var(--display);font-size:1.3rem;line-height:1.4;display:flex;flex-wrap:wrap}
.skills p span{white-space:nowrap}
.skills p span:not(:last-child)::after{content:"·";color:var(--muted);padding:0 .45em}

/* ---------- edu + leadership ---------- */
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(20px,4vw,48px)}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.edu{margin:0;padding:0}
.edu li{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;border-top:1px solid var(--rule);padding:16px 0}
.edu li:last-child{border-bottom:1px solid var(--rule)}
.edu b{font-weight:600}
.edu span{grid-column:1;color:var(--muted);font-size:.9rem}
.edu .g{grid-row:1 / span 2;grid-column:2;text-align:right;font-family:var(--display);font-size:2rem;line-height:1}
.edu .g small{display:block;font-family:var(--mono);font-size:.66rem;color:var(--muted);letter-spacing:.1em}
.lead{background:var(--soft);border-radius:22px;padding:24px 26px;align-self:start}
.lead h3{font-size:2rem}
.lead p{margin-top:10px;color:var(--ink)}

/* ---------- contact ---------- */
.contact{background:var(--ink);color:var(--bg);border-radius:28px;padding:clamp(28px,5vw,60px);margin-top:clamp(56px,9vw,104px);position:relative;overflow:hidden}
.contact h2{font-size:clamp(2.2rem,6vw,4.4rem);line-height:1;max-width:14ch}
.contact h2 em{font-style:normal;color:var(--chinar)}
.contact .leaf{position:absolute;right:-60px;bottom:-70px;width:320px;color:var(--chinar);opacity:.18;transform:rotate(18deg)}
.mail{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:26px}
.mail code{font-family:var(--mono);font-size:clamp(1rem,2.4vw,1.35rem);user-select:all;word-break:break-all}
.mail button{border:1px solid var(--bg);background:transparent;color:var(--bg);border-radius:99px;padding:7px 15px;font:500 .88rem var(--sans);cursor:pointer}
.mail button:hover{background:var(--bg);color:var(--ink)}
.clinks{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;position:relative}
.clinks .btn{border-color:color-mix(in srgb,var(--bg) 55%,transparent);color:var(--bg)}
.clinks .btn.todo{color:color-mix(in srgb,var(--bg) 55%,transparent)}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding-block:22px 34px;font-size:.82rem;color:var(--muted)}

/* ---------- motion ---------- */
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

/* ---------- present mode: one section per screen, arrow keys ---------- */
html.presenting{scroll-snap-type:y mandatory}
html.presenting .snap{scroll-snap-align:start;min-height:calc(100svh - 60px);display:flex;flex-direction:column;justify-content:center;padding-block:40px}
.hint{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font:500 .8rem var(--mono);padding:7px 14px;border-radius:99px;z-index:20}
</style>

<header class="bar">
  <div class="wrap">
    <a class="mark" href="#top"><svg><use href="#leaf"/></svg>Ibrahim Wani</a>
    <nav class="nav" aria-label="Sections">
      <a href="#work">Work</a><a class="opt" href="#journey">Journey</a><a class="opt" href="#skills">Skills</a><a href="#contact">Contact</a>
    </nav>
    <button class="present" id="present" aria-pressed="false" title="One section per screen — use arrow keys">Present</button>
  </div>
</header>

<main id="top">
  <div class="wrap">
    <section class="hero snap" aria-label="Introduction">
